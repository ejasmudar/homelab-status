owner: ejasmudar
repo: homelab-status

sites:
  # Public endpoints (reachable without Tailscale)
  - name: Home Assistant
    url: https://homeassistant.mudar.online
    expectedStatusCodes:
      - 200
      - 302
  - name: Paperless-ngx
    url: https://paperless.mudar.online
    expectedStatusCodes:
      - 200
      - 302
  - name: Nudge Reminders
    url: https://nudge.mudar.online
    expectedStatusCodes:
      - 200
      - 302

  # Internal Tailscale endpoints (requires Tailscale Action)
  - name: Proxmox1 (NAS)
    url: https://100.103.56.72:8006
    allowInsecure: true
  - name: Proxmox2
    url: https://100.113.197.28:8006
    allowInsecure: true
  - name: Proxmox3
    url: https://100.88.223.21:8006
    allowInsecure: true
  - name: Proxmox4
    url: https://100.93.156.124:8006
    allowInsecure: true
  - name: Proxmox5 (Dubai)
    url: https://100.107.192.45:8006
    allowInsecure: true
  - name: n8n
    url: https://n8n.mudar.online
    expectedStatusCodes:
      - 200
      - 302
  - name: Paperless-ngx (Internal)
    url: http://100.112.196.119:80
  - name: Home Assistant (Internal)
    url: http://100.74.137.55:80

notifications:
  - type: custom-webhook
    url: "https://ntfy.sh/ejasmudar-homelab-alerts"
    method: "POST"
    body: >-
      {
        "topic": "ejasmudar-homelab-alerts",
        "title": "{{ title }}",
        "message": "{{ message }}",
        "tags": ["warning"],
        "priority": "high"
      }
    headers:
      Content-Type: "application/json"

status-website:
  name: Ejas Homelab Status
  introTitle: "**Ejas Homelab** — Real-time uptime monitoring"
  introMessage: "Monitoring homelab services across Tailscale. Powered by [Upptime](https://github.com/upptime/upptime)."
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: "https://github.com/ejasmudar/homelab-status"

commitMessages:
  ci: "chore: run CI"
  update: "chore(ci): update graphs and data"